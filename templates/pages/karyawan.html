{{define "pages/karyawan.html"}}
{{template "layouts/header.html" .}}
    {{block "karyawan-info-element" .}}
    <div id="karyawan-info" class="mx-auto d-block w-md mt-10 border border-black rounded p-2">
        <form
            hx-post="/edit/{{.karyawan.Id}}"
            hx-target="#karyawan-info"
            hx-swap="outerHTML"
            hx-confirm="Are you sure you want to edit this karyawan?"
        >
            {{if .deleted}}
            <div class="bg-red-500">This karyawan has been deleted</div>
            {{else}}
            <div class="grid grid-cols-12">
                <div class="col-span-3 py-2">Name:</div>
                <div class="col-span-9"><input class="rounded border border-black px-2 py-1" type="text" name="name" value="{{.karyawan.Name}}"></div>
            </div>
            <div class="grid grid-cols-12">
                <div class="col-span-3 py-2">Birth Date:</div>
                <div class="col-span-9"><input class="rounded border border-black px-2 py-1" type="date" name="birthDate" value='{{.karyawan.BirthDate.Format "2006-01-02"}}'></div>
            </div>
            <div class="grid grid-cols-12">
                <div class="col-span-3 py-2">Salary:</div>
                <div class="col-span-9">Rp. <input class="rounded border border-black px-2 py-1" type="number" name="salary" value="{{.karyawan.Salary}}"> / month</div>
            </div>
            <div class="grid grid-cols-12">
                <div class="col-span-3 py-2">Position:</div>
                <div class="col-span-9"><input class="rounded border border-black px-2 py-1" type="text" name="position" value="{{.karyawan.Position}}"></div>
            </div>
            <div class="grid grid-cols-12">
                <div class="col-span-3 py-2">Joined:</div>
                <div class="col-span-9"><input class="rounded border border-black px-2 py-1" type="date" name="joined" value='{{.karyawan.Joined.Format "2006-01-02"}}'></div>
            </div>
            <div class="grid grid-cols-12 mt-10 gap-4">
                <button class="col-span-6 justify-self-end rounded border border-black px-2 py-1 bg-blue-400 cursor-pointer" type="submit">Edit</button>
                <button 
                    class="col-span-6 justify-self-start rounded border border-black px-2 py-1 bg-red-500 cursor-pointer"
                    hx-delete="/karyawan/{{.karyawan.Id}}"
                    hx-confirm="Are you sure you want to delete this karyawan?"
                    hx-target="#karyawan-info"
                    hx-swap="outerHTML"
                >
                    Delete
                </button>
            </div>
            {{end}}
        </form>
    </div>
    {{end}}
{{template "layouts/footer.html" .}}
{{end}}
